# The fork's additive guard, enforced.
#
# Why this file exists: the guard was previously reachable only from a Claude Code PostToolUse hook,
# and only its FAST variant (new files, capped at 80). `.githooks/pre-commit` does run the full
# guard, but `core.hooksPath` is repointed at vite-plus's `.vite-hooks/_` by `prepare`, so it never
# fires. Codex, Cursor, Copilot, humans and CI therefore never ran it, and 94 violations reached
# main under a rule everyone believed was hard. CI is the one place that cannot be repointed.
#
# Standalone rather than a job in ci.yml: the guard imports only Node builtins, so it needs no
# install, no Rust and no Electron — it runs in seconds, and a slow or broken main CI cannot mask a
# guard regression.
name: T3Team Additive Guard

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: t3team-additive-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  additive-guard:
    name: Additive guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The guard resolves `merge-base HEAD upstream/main`, so it needs real history.
          fetch-depth: 0

      - name: Fetch upstream
        # baseRef is still `upstream/main` (enforceCanonicalBaseRef refuses any other value), and the
        # blocking base — the forkBaselineRef tag recorded in .t3team-additive-guard.json — is fetched
        # from ORIGIN in the step below, so the upstream remote is no longer needed for the blocking
        # gate. It is still needed for the informational drift step (T3TEAM_ADDITIVE_GUARD_BASE), so
        # the remote must exist. Without it the guard silently falls back to origin/main,
        # which on this fork compares main against itself and passes vacuously.
        # Full, not shallow: a grafted shallow boundary can yield the wrong merge-base, which changes
        # what counts as "changed" instead of failing loudly.
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main
          echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"
          # Pin to the point MAIN is synced to, not this ref's own merge-base. A long-lived branch
          # forks from an older upstream, so `merge-base HEAD upstream/main` resolves years back and
          # every upstream file since then reads as "modified by this PR" — 1402 of them on PR #36.
          # Measuring every ref against main's sync point asks the right question: what does THIS
          # change add on top of the upstream we are actually based on.
          SYNC_POINT="$(git merge-base origin/main upstream/main)"
          # ...except on a sync PR, whose entire purpose is to move that point forward. Its own
          # merge-base is AHEAD of main's, and pinning to main's would read every upstream commit it
          # merges as a fork change (21 commits' worth of "new file must use prefix t3team-" on
          # PR #60). Take whichever point is further along, which is main's for every ordinary
          # branch — a stale branch's own merge-base is behind main's and is correctly ignored.
          OWN_SYNC_POINT="$(git merge-base HEAD upstream/main)"
          if git merge-base --is-ancestor "$SYNC_POINT" "$OWN_SYNC_POINT"; then
            SYNC_POINT="$OWN_SYNC_POINT"
          fi
          echo "SYNC_POINT=$SYNC_POINT" >> "$GITHUB_ENV"

      # ── Blocking ────────────────────────────────────────────────────────────────────────────────
      # The blocking base is the frozen FORK baseline — a tag recorded in `.t3team-additive-guard.json`
      # (forkBaselineRef), not upstream/main. Since this fork became a full product fork, main differs
      # from upstream on ~2.8k files; measuring against upstream (pinned to any sync point, or live)
      # fails on the fork's own debt — 1,373 violations on main alone, red on every run since 2026-09-06.
      # The baseline tag freezes the fork tree it points at: everything inside it is grandfathered debt,
      # and every new unwhitelisted upstream-file edit, new unprefixed file, or LOC growth on top of it
      # still fails the guard exactly as before. Moving the baseline is a deliberate, reviewed config
      # change (new tag + new forkBaselineRef value) — see docs/t3team-additive-whitelist.md.
      # The tag must exist on ORIGIN (this step fetches it by name; actions/checkout fetches tags too,
      # but the explicit fetch keeps the gate independent of checkout defaults). The guard itself
      # resolves and validates the tag and fails loudly when it is missing — it never falls back to
      # upstream/main or origin/main, so a missing tag cannot silently weaken the gate.
      - name: Additive guard (this branch vs the fork baseline)
        run: |
          FORK_BASELINE="$(node -p 'const c = JSON.parse(require("fs").readFileSync(".t3team-additive-guard.json", "utf8")); c.forkBaselineRef ?? "")')"
          if [ -n "$FORK_BASELINE" ]; then
            echo "Blocking base: fork baseline $FORK_BASELINE"
            git fetch --no-tags origin "+refs/tags/$FORK_BASELINE:refs/tags/$FORK_BASELINE"
          else
            # Pre-fork checkouts have no forkBaselineRef; keep the historical behavior of blocking
            # against the upstream sync point this branch is based on.
            echo "No forkBaselineRef configured; blocking against upstream sync point $SYNC_POINT."
            git update-ref refs/remotes/upstream/main "$SYNC_POINT"
          fi
          node t3team-additive-guard.mjs

      # ── Informational ───────────────────────────────────────────────────────────────────────────
      # Measures against LIVE upstream on purpose: the question here is "how far ahead has upstream
      # drifted from what this fork also edits" — a sync-planning signal, not a gate. Because the
      # configured fork baseline would otherwise take over the blocking base, the step forces the
      # canonical upstream base via T3TEAM_ADDITIVE_GUARD_BASE (the guard accepts only
      # upstream/main there, so this variable can never weaken the blocking gate).
      - name: Upstream drift (informational)
        continue-on-error: true
        run: |
          git update-ref refs/remotes/upstream/main "$UPSTREAM_HEAD"
          echo "Synced to $SYNC_POINT; upstream/main is $UPSTREAM_HEAD."
          echo "Upstream commits since sync: $(git rev-list --count "$SYNC_POINT..upstream/main")"
          T3TEAM_ADDITIVE_GUARD_BASE=upstream/main node t3team-additive-guard.mjs || true
          echo "A failure here means upstream changed files this fork also changed — run a sync."
